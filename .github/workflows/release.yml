name: Release on Merge

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/release.yml'
      - '**/*.md'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build & Push Versioned Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest version tag
        id: get-version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname '1.*' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="1.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Found latest: $LATEST_TAG"

      - name: Calculate next version
        id: version
        run: |
          LATEST="${{ steps.get-version.outputs.latest_tag }}"
          MAJOR=$(echo "$LATEST" | cut -d. -f1)
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          echo "Next version: $NEW_VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yacht
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-sha-
            type=raw,value=${{ steps.version.outputs.new_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VUE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true

      - name: Create Git tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_version }}" ${{ github.sha }}
          git push origin "${{ steps.version.outputs.new_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.new_version }}"
          name: "Yacht v${{ steps.version.outputs.new_version }}"
          body: |
            ## Yacht v${{ steps.version.outputs.new_version }}

            Built from commit ${{ github.sha }} on master after successful merge.

            ### Docker Images
            - ghcr.io/yacht-sh/yacht:latest
            - ghcr.io/yacht-sh/yacht:${{ steps.version.outputs.new_version }}

            ### CI
            Triggered on push to master. Previous tag: ${{ steps.get-version.outputs.latest_tag }}
          draft: false
          prerelease: false

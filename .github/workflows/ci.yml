name: Yacht CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  code-quality:
    name: Code Quality & Security Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: python3 -m py_compile backend/api/main.py backend/api/routers/apps.py backend/api/routers/agents.py backend/api/routers/hosts.py backend/api/actions/apps_runtime.py backend/api/utils/docker_hosts.py

      - name: Frontend install
        run: |
          cd frontend
          npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Frontend build
        run: |
          cd frontend
          npm run build

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
        continue-on-error: true

      - name: Run Bandit (security static analysis)
        run: |
          pip install bandit
          bandit -q -r backend/api

      - name: Audit backend dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner=off || echo "::warning::Known vulnerabilities found — see Trivy scan for runtime image"
        continue-on-error: true

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yacht-dist
          path: |
            frontend/dist
            backend/api
          retention-days: 7

  docker:
    name: Docker Build & Push
    needs: code-quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yacht
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VUE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=main-image-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=main-image-${{ github.ref_name }}
          provenance: mode=max
          sbom: true

  image-scan:
    name: Image Security Scan
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata (for image tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yacht
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CR_PAT }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.CR_PAT }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/yacht:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CR_PAT }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.CR_PAT }}
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/yacht:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          scan-type: config
